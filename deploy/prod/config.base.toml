# ------------------------------------------------------------------------------
# BASE (POSTGRES) MODE CONFIGURATION -- zombie-crab-project / PROD (no Traefik)
#
# Postgres-backed (mycelium's DEFAULT `postgres-backend` feature -- i.e. the
# plain published image `ghcr.io/LepistaBioinformatics/mycelium`, NOT the
# `--features standalone` build). Used ONLY by the prod profile, mounted into the
# official image at /home/config.toml via docker-compose.prod.yaml (SETTINGS_PATH):
#   docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d
# The default local stack still uses config.standalone.toml (SQLite, no external
# deps) -- this file changes ONLY the infrastructure sections; the API-gateway
# routing below is IDENTICAL to config.standalone.toml (crab-shell-proxy:8080,
# protectedByRoles, the full alpha/beta route set).
#
# THIS MODE IS NOT THE TRAEFIK ONE. It keeps the base file's PUBLISHED HOST PORTS
# (gateway :8080, chat-webapp :3000, mycelium-webapp :8081) and terminates no TLS
# of its own. For Traefik/Dokploy ingress by domain use the self-contained
# docker-compose.dokploy.yaml with deploy/dokploy/config.base.toml -- the two
# files are otherwise identical, and the origins below are the difference.
#
# Differences vs. standalone, all infra:
#   - vault disabled; core/jwt/hmac/token secrets resolved from env (base mode
#     does NOT auto-generate them the way standalone does);
#   - [diesel] Postgres instead of [sqlite];
#   - [smtp] real transport (base mode has NO stub -- magic-link needs real
#     delivery). Every [smtp] field is SecretResolver<String>, so all come from
#     env (verified against adapters/notifier/src/models/smtp_config.rs);
#   - [redis] section must EXIST (base wiring requires it) but no Redis container
#     runs -- redis::Client::open() is connection-lazy, so the gateway boots and
#     serves fine without one (STATE.md AD-005/L-009). Code paths that actually
#     hit the shared cache/notifier would error on first use -- acceptable for
#     this stack; revisit if you add a Redis container.
#
# ►►► REPLACE BEFORE DEPLOY (plain strings -- NOT env-resolvable, and this file
#     is mounted so no rebuild is needed): `noreplyEmail` / `supportEmail`, and
#     `domainUrl` UNLESS this really is a localhost deploy. noreplyEmail MUST
#     equal MYC_SMTP_USERNAME (your Gmail address) -- Gmail rejects a mismatched
#     From. domainUrl goes into REAL magic-link emails in this mode (base mode
#     has no stub transport), so a localhost value there ships unusable links to
#     anyone not sitting at the host.
#
#     `allowedOrigins` is pre-set to the origins this mode actually serves and is
#     correct as shipped. Change it only together with the webapp build arg --
#     see its own comment below.
# ------------------------------------------------------------------------------

vault = "disabled"

# ------------------------------------------------------------------------------
# CORE CONFIGURATIONS
# ------------------------------------------------------------------------------

[core.accountLifeCycle]
domainName = "Zombie Crab"
# ►►► REPLACE unless this is genuinely a localhost deploy. Base URL mycelium
# writes into the emails it really sends (magic-link, invitations), so it must be
# the URL a human actually opens -- not an internal service name, and not
# localhost if the users are anywhere else. The default matches this mode's
# published gateway port; behind a reverse proxy, put its public https:// URL.
domainUrl = "http://localhost:8080"
tokenExpiration = 3600                                                # 1 hour
noreplyName = "Mycelium"
noreplyEmail = "your-account@gmail.com"                       # ►►► REPLACE (== MYC_SMTP_USERNAME)
supportName = "Mycelium"
supportEmail = "your-account@gmail.com"                       # ►►► REPLACE
locale = "en-us"
tokenSecret = { env = "MYC_BASE_TOKEN_SECRET" }

# Gates the one-time web Staff bootstrap flow (GET/POST /_adm/instance/bootstrap*).
# Reuses the same env var the standalone stack already documents.
staffBootstrapSecret = { env = "MYC_STANDALONE_BOOTSTRAP_SECRET" }

hmacPrimaryVersion = 1

[[core.accountLifeCycle.hmacSecrets]]
version = 1
secret = { env = "MYC_BASE_HMAC_SECRET" }

[core.webhook]
acceptInvalidCertificates = true
consumeIntervalInSecs = 30
consumeBatchSize = 25
maxAttempts = 5

# ------------------------------------------------------------------------------
# POSTGRES DATABASE ADAPTER SETTINGS
#
# Schema is NOT auto-provisioned (diesel_postgres has no embedded migrations,
# unlike SQLite) -- apply it once after first `up` (STATE.md L-009):
#   psql ... -f adapters/diesel_postgres/sql/up.sql -v db_password=... -v db_name=...
# then every script under adapters/diesel_postgres/sql/migrations/ -- up.sql at
# rc.13 does NOT include instance_settings, resource_audit_log or the tenant
# envelope-encryption columns. Both live in the mycelium repo at the tag this
# deploy pins. See the README's "Deploy modes" section for the exact commands
# (it also explains the harmless "role already exists" up.sql prints).
# ------------------------------------------------------------------------------

[diesel]
databaseUrl = { env = "MYC_BASE_DATABASE_URL" }

# ------------------------------------------------------------------------------
# SMTP -- base mode has no stub/file transport (that's a `standalone`-only Cargo
# feature). host/username/password are SecretResolver<String> and resolve from
# env; `port` is SecretResolver<u16> and is kept LITERAL (an env value is a
# string and won't deserialize into u16 -- rc.7's own config.full.example.toml
# uses a literal 465 too). Port 465 = implicit TLS, which is what mycelium's
# SmtpTransport::relay() negotiates (this is why 465, not 587/STARTTLS -- see
# STATE.md L-012). MYC_SMTP_USERNAME is the full Gmail address; MYC_SMTP_PASSWORD
# is a Gmail App Password (requires 2FA), NOT the account password.
# ------------------------------------------------------------------------------

[smtp]
host = { env = "MYC_SMTP_HOST" }
port = 465
username = { env = "MYC_SMTP_USERNAME" }
password = { env = "MYC_SMTP_PASSWORD" }

[queue]
emailQueueName = "emails"
consumeIntervalInSecs = 15

# ------------------------------------------------------------------------------
# REDIS -- required to exist, but no Redis container runs (see header note).
# ------------------------------------------------------------------------------

[redis]
protocol = "redis"
hostname = "mycelium-redis"
password = "unused-no-redis-container-in-this-stack"

# ------------------------------------------------------------------------------
# AUTHENTICATION SETTINGS
# ------------------------------------------------------------------------------

[auth.internal.define]
jwtExpiresIn = 43200                                                  # 12 hours
tmpExpiresIn = 300                                                    # 5 minutes
jwtSecret = { env = "MYC_BASE_JWT_SECRET" }

# ------------------------------------------------------------------------------
# API PORT SETTINGS
# ------------------------------------------------------------------------------

[api]
serviceIp = "0.0.0.0"
servicePort = 8080
serviceWorkers = 1
gatewayTimeout = 60

# The mycelium-webapp SPA calls the gateway DIRECTLY from the browser, so its
# origin has to be allowed here -- and it must be the origin the SPA is actually
# served from. This mode does not override the base file's build arg, so the SPA
# is built with VITE_MYCELIUM_API_URL=http://localhost:${MYCELIUM_PORT:-8080} and
# served on http://localhost:${MYCELIUM_WEBAPP_PORT:-8081}: those are the two
# origins below. Put a public hostname here ONLY together with rebuilding
# mycelium-webapp against the matching URL (docker-compose.yaml's
# `mycelium-webapp.build.args.VITE_MYCELIUM_API_URL`) -- changing one and not the
# other is a CORS failure that looks like a broken admin UI.
# chat-webapp is a server-side BFF and does NOT need to be listed.
allowedOrigins = ["http://localhost:8080", "http://localhost:8081"]

# No TLS terminator in this mode: the gateway serves plain HTTP on its published
# host port. Front it with a reverse proxy (or use the Dokploy/Traefik profile)
# before it faces anything but a trusted network.
tls = "disabled"

[api.cache]
jwksTtl = 3600
emailTtl = 120
profileTtl = 120

[api.logging]
level = "warn,mycelium_base=info,myc_api=info,myc_config=info,myc_core=info,myc_http_tools=info,actix_web=info,myc_notifier=info,myc_diesel=info,myc_kv=info"
format = "ansi"
target = "stdout"

# ==============================================================================
# API GATEWAY ROUTE CONFIGURATION -- IDENTICAL to config.standalone.toml,
# agent for agent (alpha, beta). See that file's `[api.services]`
# comment block for the full routing, header contract, and protectedByRoles
# rationale. Kept in sync verbatim: only the infrastructure sections above
# differ between standalone and base mode. A route added to one of the three
# deploy TOMLs has to be added to the others.
# ==============================================================================

[api.services]

[[alpha]]
host = "crab-shell-proxy:8080"
protocol = "http"
healthCheckPath = "/healthz"
discoverable = true
serviceType = "rest-api"
isContextApi = false
openapiPath = "/doc/openapi.json"
capabilities = ["chat"]
description = "PicoClaw agent 'alpha' - an OpenAI-compatible personal chat agent. Each user gets an isolated container; send chat via POST /v1/chat/completions."

[[alpha.secret]]
name = "alpha-authorization-header"
authorizationHeader = { headerName = "Authorization", prefix = "Bearer", token = { env = "MYC_PICOCLAW_ALPHA_TOKEN" } }

[[alpha.path]]
group = { protectedByRoles = [{ name = "alpha", permission = "write" }] }
path = "/v1/chat/completions"
secretName = "alpha-authorization-header"
acceptInsecureRouting = true
methods = ["POST"]

[[alpha.path]]
group = { protectedByRoles = [{ name = "alpha" }] }
path = "/v1/models"
secretName = "alpha-authorization-header"
acceptInsecureRouting = true
methods = ["GET"]

[[alpha.path]]
# user-owned-models: a member registering their own model, testing it, and
# choosing between it and the one their administrator provides.
#
# ONE wildcard block (mycelium matches with the wildmatch crate, so `*` spans
# `mine`, `mine/test` and `mine/selection`), gated on the role NAME only —
# /v1/models above already has its own block, so there is no route conflict.
# GET needs only read; every mutation must require write, and that is enforced
# in-proxy by the same profile chain /v1/secrets uses.
#
# A personal model IS a picoclaw model_list entry, written into the user's
# config.json — so this route only means anything for an agent that reads it.
group = { protectedByRoles = [{ name = "alpha" }] }
path = "/v1/models/*"
secretName = "alpha-authorization-header"
acceptInsecureRouting = true
methods = ["GET", "POST", "PUT", "DELETE"]

[[alpha.path]]
group = { protectedByRoles = [{ name = "alpha" }] }
path = "/v1/sessions/history"
secretName = "alpha-authorization-header"
acceptInsecureRouting = true
methods = ["GET"]

[[alpha.path]]
group = { protectedByRoles = [{ name = "alpha" }] }
path = "/v1/sessions/resolve"
secretName = "alpha-authorization-header"
acceptInsecureRouting = true
methods = ["GET"]

[[alpha.path]]
group = "protected"
path = "/v1/subscriptions"
secretName = "alpha-authorization-header"
acceptInsecureRouting = true
methods = ["GET"]

[[alpha.path]]
group = { protectedByRoles = [{ name = "alpha", permission = "write" }] }
path = "/v1/secrets"
secretName = "alpha-authorization-header"
acceptInsecureRouting = true
methods = ["GET", "POST", "DELETE"]

[[alpha.path]]
group = { protectedByRoles = [{ name = "alpha", permission = "write" }] }
path = "/v1/media"
secretName = "alpha-authorization-header"
acceptInsecureRouting = true
methods = ["GET", "POST", "DELETE"]

[[alpha.path]]
# Uploads-tree organisation (create folder, move/rename, delete folder). ONE
# wildcard block: `*` matches the following segment, and /v1/media itself already
# has its own block above, so there is no "Multiple routes found" conflict.
#
# Same write gate as /v1/media, because these write into the same directory an
# upload does. DELETE here is a RECURSIVE folder delete — the proxy refuses the
# uploads root, and the interface names the file count before the member confirms.
group = { protectedByRoles = [{ name = "alpha", permission = "write" }] }
path = "/v1/media/*"
secretName = "alpha-authorization-header"
acceptInsecureRouting = true
methods = ["POST", "DELETE"]

[[alpha.path]]
# Projects (agent-projects): a member carving their own agent into Claude-style
# projects, each backed by its own picoclaw agent, workspace and AGENT.md.
#
# ONE block per path shape, gated on the role NAME only, because the gateway
# matches routes by path alone and rejects two blocks sharing one path -- the
# same constraint /v1/restart documents. GET needs only read; POST must require
# write, and that is enforced in-proxy by the same profile chain /v1/secrets
# uses. A read-only member reaching a mutation gets a 403 there.
#
# A project IS a picoclaw agents.list entry plus a dispatch rule, written into
# the user's config.json — so this route only means anything for an agent that
# reads it.
group = { protectedByRoles = [{ name = "alpha" }] }
path = "/v1/projects"
secretName = "alpha-authorization-header"
acceptInsecureRouting = true
methods = ["GET", "POST"]

[[alpha.path]]
# Per-project mutations: /v1/projects/<id>. Wildcard because the id is a path
# segment, mirroring /v1/media/* and /v1/memory-graph/*.
group = { protectedByRoles = [{ name = "alpha" }] }
path = "/v1/projects/*"
secretName = "alpha-authorization-header"
acceptInsecureRouting = true
methods = ["PATCH", "DELETE"]

[[alpha.path]]
group = { protectedByRoles = [{ name = "alpha", permission = "write" }] }
path = "/v1/memory"
secretName = "alpha-authorization-header"
acceptInsecureRouting = true
methods = ["GET", "PUT"]

[[alpha.path]]
# Knowledge-graph memory (memory-graph-mcp): READ-ONLY views of the graph the
# agent builds through its own native MCP server inside crab-shell-proxy.
#
# TWO blocks: mycelium's `*` matches a following segment, so it covers
# /nodes, /search and /recent but not the bare /v1/memory-graph.
#
# Gated `write` like /v1/memory even though every method here is GET. The proxy
# authorizes these with authorizeSecret -- the same write-access chain -- so a
# read-only member is refused in-proxy regardless; gating lower here would only
# move the 403 from the gateway to the proxy.
#
# There is deliberately NO /v1/mcp route: the agent reaches that endpoint
# directly on the container network, never through the gateway.
path = "/v1/memory-graph"
group = { protectedByRoles = [{ name = "alpha", permission = "write" }] }
secretName = "alpha-authorization-header"
acceptInsecureRouting = true
methods = ["GET"]

[[alpha.path]]
path = "/v1/memory-graph/*"
group = { protectedByRoles = [{ name = "alpha", permission = "write" }] }
secretName = "alpha-authorization-header"
acceptInsecureRouting = true
methods = ["GET"]

[[alpha.path]]
# Self-service restart (restart-control): GET reports whether this member's
# instance still needs a bounce (and when an admin scheduled one); POST performs
# it for the caller's OWN container only.
#
# ONE block covering both methods, gated on the role NAME (read), even though
# POST must require write. The gateway matches routes by path alone and errors
# with "Multiple routes found for the specified path" when two blocks share one
# path -- so GET and POST cannot be gated differently here. The write requirement
# for POST is enforced in-proxy instead, by the same profile chain /v1/secrets
# uses; a read-only member reaching POST gets a 403 from the proxy.
group = { protectedByRoles = [{ name = "alpha" }] }
path = "/v1/restart"
secretName = "alpha-authorization-header"
acceptInsecureRouting = true
methods = ["GET", "POST"]

[[alpha.path]]
# Scheduled tasks (scheduled-tasks): READ-ONLY views of picoclaw's own cron jobs
# and the per-run transcripts each execution leaves in the sessions dir.
#
# ONE wildcard block: mycelium's `*` matches the following segment, which covers
# both /v1/cron/tasks and /v1/cron/runs. There is deliberately no bare /v1/cron
# route, because the proxy exposes none — so no "Multiple routes found" conflict.
#
# Gated on the role NAME (read), matching /v1/restart: the proxy authorizes these
# with its read chain, so a member holding only read on the agent can still see
# what is scheduled and what it produced.
#
# GET only, and that is the whole surface: nothing here writes the job store.
# picoclaw holds the live schedule in memory, so an externally edited store could
# silently disagree with the timers actually running.
group = { protectedByRoles = [{ name = "alpha" }] }
path = "/v1/cron/*"
secretName = "alpha-authorization-header"
acceptInsecureRouting = true
methods = ["GET"]

[[alpha.path]]
# All /v1/admin/* endpoints share group=protected + this secret; the
# proxy enforces the exact path+method per route. Collapsed to one
# wildcard (mycelium matches via the wildmatch crate).
group = "protected"
path = "/v1/admin/*"
secretName = "alpha-authorization-header"
acceptInsecureRouting = true
methods = ["GET", "POST", "PUT", "DELETE"]

