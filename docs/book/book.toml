[book]
title = "zombie-crab-project"
description = "One real, isolated AI agent per user — behind a single authenticated front door."
authors = ["Samuel Galvão Elias <sgelias@outlook.com>"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false
use-default-preprocessors = true

[preprocessor.index]

[preprocessor.links]

[preprocessor.gettext]
after = ["links"]

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
additional-css = ["theme/custom.css"]
no-section-label = false
git-repository-url = "https://github.com/LepistaBioinformatics/zombie-crab-project"
edit-url-template = "https://github.com/LepistaBioinformatics/zombie-crab-project/edit/main/docs/book/{path}"
site-url = "/zombie-crab-project/"

[output.html.print]
enable = true
page-break = true

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.playground]
editable = false
copyable = true
runnable = false

[output.html.fold]
enable = true
level = 1
