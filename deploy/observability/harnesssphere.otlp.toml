# HarnessSphere — configuration for the zombie-crab stack.
#
# This file is what the container runs (baked to /etc/harnesssphere/config.toml).
# It configures ONLY fields that exist today: this is the "land it, change no Rust"
# step, so that the first run against the live stack tests the tree whose behaviour
# is documented.
#
# NO SECRET GOES IN THIS FILE. It is committed. Anything sensitive arrives by
# environment.

# --- Critical sources: host (hospedeiro) and self. ---------------------------
# These two are the only mandatory layers; if either cannot be read, the watcher
# exits non-zero rather than pretending to observe.
#
# The host values are the HOST's, not this container's, and that is measured
# rather than assumed: sysinfo reads /proc/meminfo and /proc/stat, which Docker
# does not namespace. A run capped at -m 512m reported the host's 33 GB.
host_interval_secs = 10
self_interval_secs = 30
critical_threshold = 3

# --- Export ------------------------------------------------------------------
# `stdout` is the deliberate default: it proves the whole pipeline with no backend
# to stand up, and choosing a durable backend is a separate decision that should be
# made with a real cardinality figure in hand. Override with HARNESSSPHERE_EXPORTER.
exporter = "otlp"
otlp_endpoint = "http://otel-collector:4317"
service_name = "harnesssphere"
metric_export_interval_secs = 15

# --- Probes: the three fixed compose services --------------------------------
# Named by their COMPOSE SERVICE NAMES on zombie_net. Note the third one: the
# repository is called `crab-exoskeleton-webapp`, but the compose service — and
# therefore the only name that resolves on this network — is `chat-webapp`.
#
# No depends_on is needed for these, and adding `condition: service_healthy` would
# be wrong. EndpointProbeCollector::probe() never touches the network (it returns
# Ready when the target list is non-empty); reachability is decided per tick inside
# collect(), which emits endpoint.up = 0 for a target that is down. Ordering the
# watcher behind the health of what it watches would suppress the exact signal it
# exists to produce.
# Each target names the layer it belongs to. Before this, one collector stamped one
# layer on every target, so the proxy and the webapp both filed themselves under
# "gateway" and three of the six layers were unanswerable by construction.

# --- Session-derived AI activity (picoclaw workspaces) -----------------------
# The root of crab-shell-proxy's data directory -- the one containing tenants/.
# The compose file mounts it read-only at /data.
#
# harness-sphere rescans this tree on `discovery_interval_secs` and runs ONE session
# collector per (tenant, subscription, agent, user), each attributed with the full
# tuple. This replaces the old single-valued `session_dir`, which could only ever
# name one workspace and so emitted a metric that described one member while reading
# like it described the stack.
#
# Traversal requires privileges: the tree is root:root 0700 (AD-023).
data_root = "/data"
discovery_interval_secs = 30
# Slower than discovery on purpose: finding a workspace is a directory glob, reading
# one is IO proportional to its conversation history.
session_interval_secs = 60
# Skills, memory files and the knowledge graph. Slower than sessions on purpose: these
# change rarely, while transcripts change constantly.
learning_interval_secs = 300
session_source = "picoclaw"

# --- Still single-valued, still empty ----------------------------------------
container_cgroup = ""
container_id = ""
watch_processes = []

# --- Gone, not merely unconfigured -------------------------------------------
# The OTLP ingest receiver and the Prometheus scraper were DELETED, not disabled.
# Nothing in this stack pushes OTLP at us and nothing exposes an exposition
# endpoint, so both were a receive path with no sender. There is no feature flag
# to turn them back on.

# --- Probe targets MUST STAY LAST -------------------------------------------
# TOML scopes every bare key to the table header above it, so any scalar written
# below this point is absorbed into the last [[probe_targets]] entry instead of
# the root table. Add new scalar settings ABOVE this line.
[[probe_targets]]
address = "mycelium-gateway:8080"
layer = "gateway"

[[probe_targets]]
address = "crab-shell-proxy:8080"
layer = "proxy"

[[probe_targets]]
address = "chat-webapp:3000"
layer = "webapp"
